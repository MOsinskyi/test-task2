[project]
name = "test-task2"
version = "0.1.0"
description = ""
authors = [
    {name = "Maksym",email = "maximosinskiy@gmail.com"}
]
requires-python = ">=3.14,<4"
dependencies = [
    "fastapi (>=0.136.3,<0.137.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "celery (>=5.6.3,<6.0.0)",
    "sqlalchemy (>=2.0.50,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "uvicorn (>=0.48.0,<0.49.0)",
    "redis (>=8.0.0,<9.0.0)",
    "pydantic-settings (>=2.14.1,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "fastapi-limiter @ git+https://github.com/long2ice/fastapi-limiter",
