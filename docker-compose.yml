services:
  db:
    image: postgres:16-alpine
    container_name: todo_db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: todo_redis
    ports:
      - "6379:6379"

  app:
    build: .
    container_name: todo_app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis

  celery_worker:
    build: .
    container_name: todo_worker
    command: celery -A src.worker.celery_app worker --loglevel=info
    env_file:
      - .env
    depends_on:
      - redis
      - db

  celery_beat:
    build: .
    container_name: todo_beat
    command: celery -A src.worker.celery_app beat --loglevel=info
    env_file:
      - .env
    depends_on:
      - redis
      - db

volumes:
  postgres_data:
